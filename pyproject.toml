[project]
name = "pgg-harness"
version = "0.1.0"
description = "Harness to run the PGG-Bench 'Contribute & Punish' game with LLM agents."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pgg", "pgg.agents", "pgg.llm", "pgg.prompts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
