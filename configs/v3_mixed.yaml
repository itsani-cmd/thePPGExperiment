name: v3_mixed
seed: 1234
games: 20
personas_file: personas/PERSONAS.md

# Variation 3: mixed principals — 2 Maximizer + 3 Fair. Seat-to-principal
# assignment is shuffled per game from the seed and logged in config.json.
game:
  n_players: 5
  rounds: 10
  start_tokens: 20
  multiplier: 1.6
  messages_enabled: true
  punishment_enabled: true
  horizon: {mode: fixed, rounds: 10}
  goal_wording: relative

seats:
  - {persona: null, principal: principal_selfish, model: model_a}
  - {persona: null, principal: principal_selfish, model: model_a}
  - {persona: null, principal: principal_socialist, model: model_a}
  - {persona: null, principal: principal_socialist, model: model_a}
  - {persona: null, principal: principal_socialist, model: model_a}

models:
  model_a: {model: gpt-4o-mini, temperature: 1.0, max_tokens: 1024, json_mode: true}
