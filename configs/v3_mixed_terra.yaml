name: v3_mixed_terra
seed: 1234
games: 1
personas_file: personas/PERSONAS.md

# Variation 3, MIXED principals: 2 "maximize my tokens" + 3 "be a fair
# community member", shuffled onto seats per game (logged in config.json).
# This copy runs every seat on gpt-5.6-terra. Pair it with v3_mixed_luna.yaml
# (same seed) to compare the two models on the identical setup.
game:
  n_players: 5
  rounds: 10
  start_tokens: 20
  multiplier: 1.6
  messages_enabled: true
  message_mode: sequential
  punishment_enabled: true
  horizon: {mode: fixed, rounds: 10}
  goal_wording: relative

seats:
  - {persona: null, principal: principal_selfish, model: m}
  - {persona: null, principal: principal_selfish, model: m}
  - {persona: null, principal: principal_socialist, model: m}
  - {persona: null, principal: principal_socialist, model: m}
  - {persona: null, principal: principal_socialist, model: m}

models:
  m: {model: gpt-5.6-terra, temperature: 1.0, max_tokens: 400, json_mode: true}
