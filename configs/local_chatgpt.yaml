name: local_chatgpt
seed: 1234
games: 1
# Five personas, one per seat, all played by ChatGPT through a local
# CLIProxyAPI (see SETUP.md). Requires:
#   PGG_BASE_URL=http://127.0.0.1:8317/v1
#   PGG_API_KEY=<the key in ~/cliproxyapi/pgg_api_key.txt>
personas_file: personas/defs

game:
  n_players: 5
  rounds: 10
  start_tokens: 20
  multiplier: 1.6
  messages_enabled: true
  message_mode: sequential
  punishment_enabled: true
  horizon: {mode: fixed, rounds: 10}
  goal_wording: relative

seats:
  - {persona: good_samaritan, principal: good_samaritan, model: chatgpt}
  - {persona: selfish, principal: selfish, model: chatgpt}
  - {persona: flaky, principal: flaky, model: chatgpt}
  - {persona: follower, principal: follower, model: chatgpt}
  - {persona: socialist, principal: socialist, model: chatgpt}

models:
  chatgpt:
    model: gpt-6-luna
    temperature: 1.0
    max_tokens: 400
    json_mode: true
