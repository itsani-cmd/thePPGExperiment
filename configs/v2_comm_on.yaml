name: v2_comm_on
seed: 1234
games: 20
# Run the full batch once per model listed (keys under models:).
sweep_models: [chatgpt, claude]
personas_file: personas/defs

# Variation 2, communication ON (same as baseline messaging).
game:
  n_players: 5
  start_tokens: 20
  multiplier: 1.6
  messages_enabled: true
  message_mode: sequential
  punishment_enabled: true
  horizon: {mode: fixed, rounds: 10}
  goal_wording: relative

seats:
  - {persona: good_samaritan, principal: good_samaritan}
  - {persona: selfish, principal: selfish}
  - {persona: flaky, principal: flaky}
  - {persona: follower, principal: follower}
  - {persona: socialist, principal: socialist}

models:
  chatgpt: {model: gpt-6-luna, temperature: 1.0, max_tokens: 1024, json_mode: true}
  claude: {model: claude-sonnet-5-5, temperature: 1.0, max_tokens: 1024, json_mode: true}
