<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Selfish persona finishing place, messages on vs off, for each model"><rect width="760" height="330" fill="#fcfcfb"/>
<text x="24" y="28" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600" font-family="-apple-system,Helvetica,Arial,sans-serif">The selfish seat drops from the top to last place when messages are off</text>
